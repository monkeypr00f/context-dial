name: Validate ESPHome configuration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esphome==2026.9.1
      - name: Use test-only credentials
        run: cp esphome/secrets.example.yaml esphome/secrets.yaml
      - name: Validate YAML
        run: esphome config esphome/context_dial.yaml
      - name: Generate C++ (not a binary build)
        run: esphome compile --only-generate esphome/context_dial.yaml
